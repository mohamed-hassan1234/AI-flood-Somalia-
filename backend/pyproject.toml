[project]
name="somalia-ai-backend"
version="0.1.0"
requires-python=">=3.10"
dependencies=["fastapi>=0.116,<1","uvicorn[standard]>=0.35,<1","pydantic[email]>=2.10,<3","pydantic-settings>=2.10,<3","sqlalchemy>=2.0.41,<3","alembic>=1.16,<2","pymysql>=1.1,<2","cryptography>=50,<51","pyjwt>=2.10,<3","argon2-cffi>=25,<26","python-multipart>=0.0.20,<1","celery[redis]>=5.5,<6","boto3>=1.39,<2","structlog>=25,<26","numpy>=1.26,<2.4","pandas>=2.2,<3","scikit-learn>=1.5,<2","joblib>=1.4,<2","shapely>=2.0,<3"]
[project.optional-dependencies]
test=["pytest>=9.0.3,<10","httpx>=0.28,<1","ruff>=0.12,<1","mypy>=1.17,<2"]
[tool.pytest.ini_options]
testpaths=["app/tests"]
[tool.ruff]
line-length=100
[tool.mypy]
python_version="3.10"
[[tool.mypy.overrides]]
module="sklearn.*"
ignore_missing_imports=true
[[tool.mypy.overrides]]
module="boto3.*"
ignore_missing_imports=true
[[tool.mypy.overrides]]
module="celery.*"
ignore_missing_imports=true
[[tool.mypy.overrides]]
module="shapely.*"
ignore_missing_imports=true
[build-system]
requires=["setuptools>=78"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
exclude=["alembic*"]
