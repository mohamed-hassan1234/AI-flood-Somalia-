services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 5s, timeout: 5s, retries: 20}
    volumes: [mysql-data:/var/lib/mysql]
  redis: {image: redis:7.4-alpine}
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes: [minio-data:/data]
  migration:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on: {mysql: {condition: service_healthy}}
    restart: "no"
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {migration: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  seed:
    build: ./backend
    command: python -m scripts.seed_development
    env_file: .env
    profiles: ["seed"]
    depends_on: {migration: {condition: service_completed_successfully}}
    restart: "no"
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker -l INFO -Q ingestion,ml,notifications
    env_file: .env
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
      minio: {condition: service_started}
    restart: unless-stopped
  scheduler:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat -l INFO
    env_file: .env
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes: {mysql-data: {}, minio-data: {}}
